name: Community Windows release

on:
  push:
    tags:
      - 'v*-plus.*'

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows x64 release
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install reproducible dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Build installer
        shell: pwsh
        run: |
          npx --no-install electron-builder --win nsis --publish never
          if ($LASTEXITCODE -ne 0) { throw 'Windows installer build failed' }
          $installer = Get-ChildItem dist -File -Filter '*.exe' | Where-Object { $_.Name -notlike '*__uninstaller*' } | Select-Object -First 1
          if (-not $installer) { throw 'NSIS installer not found' }
          Move-Item -LiteralPath $installer.FullName -Destination 'dist/Riff-Plus-44.0.0-plus.1-Windows-x64-Setup.exe'
      - name: Build portable executable
        shell: pwsh
        run: |
          npx --no-install electron-builder --win portable --publish never
          if ($LASTEXITCODE -ne 0) { throw 'Windows portable build failed' }
          $portable = Get-ChildItem dist -File -Filter '*.exe' | Where-Object { $_.Name -notlike '*-Setup.exe' -and $_.Name -notlike '*__uninstaller*' } | Select-Object -First 1
          if (-not $portable) { throw 'Portable executable not found' }
          Move-Item -LiteralPath $portable.FullName -Destination 'dist/Riff-Plus-44.0.0-plus.1-Windows-x64-Portable.exe'
      - name: SHA-256 checksums
        shell: pwsh
        run: |
          $assets = Get-ChildItem dist -File | Where-Object { $_.Name -match 'Riff-Plus-.+-Windows-x64-(Setup|Portable)\.exe$' }
          if ($assets.Count -ne 2) { throw "Expected two Windows executables, found $($assets.Count)" }
          $lines = @($assets | Sort-Object Name | ForEach-Object { "$((Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)" })
          [System.IO.File]::WriteAllLines((Join-Path (Resolve-Path dist) 'SHA256SUMS.txt'), $lines, [System.Text.Encoding]::UTF8)
          Get-Content dist/SHA256SUMS.txt
      - name: Publish GitHub Release with checksums
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create '${{ github.ref_name }}' `
            'dist/Riff-Plus-44.0.0-plus.1-Windows-x64-Setup.exe' `
            'dist/Riff-Plus-44.0.0-plus.1-Windows-x64-Portable.exe' `
            'dist/SHA256SUMS.txt' `
            --repo '${{ github.repository }}' `
            --title 'Riff+ 44.0.0-plus.1 (Windows x64)' `
            --notes-file '.github/COMMUNITY_RELEASE_NOTES.md' `
            --verify-tag

